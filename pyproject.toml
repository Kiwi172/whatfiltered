[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "whatfiltered"
version = "1.0.0"
description = "What does this machine's firewall actually let through? Read-only nftables/iptables exposure auditor. Stdlib only."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Kiwi172" }]
keywords = ["nftables", "iptables", "firewall", "audit", "exposure", "security"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]

[project.scripts]
whatfiltered = "whatfiltered:main"

[tool.setuptools]
py-modules = ["whatfiltered"]
