name: CI
on:
  push:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: standalone tests (no pytest)
        run: python3 tests/test_whatfiltered.py

      - name: pytest
        run: |
          pip install --quiet pytest
          pytest -q

      - name: audit the runner's live ruleset
        run: |
          sudo nft -j list ruleset > ruleset.json
          python3 whatfiltered.py -f ruleset.json --probe 22,80,8080
          python3 whatfiltered.py -f ruleset.json --format json > report.json
          python3 -c "import json; d=json.load(open('report.json')); assert 'policies' in d and 'probes' in d"

      - name: companion integration with whatserved
        run: |
          git clone --depth 1 https://github.com/Kiwi172/whatserved ../whatserved
          python3 -m http.server 8080 --bind 127.0.0.1 >/dev/null 2>&1 &
          sleep 1
          sudo python3 ../whatserved/whatserved.py --json > served.json
          kill %1
          sudo nft -j list ruleset > ruleset.json
          python3 whatfiltered.py -f ruleset.json --expose served.json
          python3 -c "import json,sys; d=json.load(open('served.json')); sys.exit(0 if any(s.get('port')==8080 and s.get('listening') for s in d['services']) else 'our 8080 listener must appear in whatserved output')"
